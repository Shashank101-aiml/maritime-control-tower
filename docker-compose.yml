services:
  db:
    image: postgres:16-alpine
    container_name: maritime-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-maritime}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-maritime}
      POSTGRES_DB: ${POSTGRES_DB:-maritime}
    volumes:
      # Named volume, so history survives `docker compose down`.
      - maritime-db-data:/var/lib/postgresql/data
    ports:
      # Published on 5433 by default: a native PostgreSQL service often
      # already holds 5432 on the host, and Docker will happily bind
      # alongside it, leaving host connections silently reaching the
      # wrong server. Containers talk to this one as db:5432 regardless.
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    healthcheck:
      # The backend waits for this rather than racing the database on
      # startup and failing its migrations.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-maritime} -d ${POSTGRES_DB:-maritime}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: maritime-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      # Overrides the .env value so the container talks to the db
      # service rather than a host-local SQLite file.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-maritime}:${POSTGRES_PASSWORD:-maritime}@db:5432/${POSTGRES_DB:-maritime}
    depends_on:
      db:
        condition: service_healthy
    # Schema is applied by Alembic at container start; the app no longer
    # creates tables itself.
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: maritime-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  maritime-db-data:
